<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello Kaffi - Redirecting...</title>
    <script>
        // Automatic redirect agad sa Customer Portal pag-open ng website
        window.location.replace("./customer-portal/");

        // Shortcut listener para sa Alt + A papuntang POS Admin Portal
        window.addEventListener('keydown', function(event) {
            if (event.altKey && (event.key === 'a' || event.key === 'A')) {
                event.preventDefault();
                window.location.href = "./pos-admin-portal/";
            }
        });
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background: #f9f9f9;">
    <p>Redirecting to Customer Portal...</p>
    <p><small>Tip: Press <b>Alt + A</b> to go to POS Admin Portal.</small></p>
</body>
</html>
